server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cafe_db}
spring.datasource.username=${DATABASE_USERNAME:cafe_user}
spring.datasource.password=${DATABASE_PASSWORD:cafe_dev_password}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
